name: Import Ponytail and Design Skills
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'RUN_SKILL_IMPORT'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Copy exact upstream files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ponytail design
          curl -L --fail 'https://raw.githubusercontent.com/DietrichGebert/ponytail/14a0d79548d4de8fc2de95c1b94bb0de63a739d3/SKILL.md' -o ponytail/SKILL.md
          curl -L --fail 'https://raw.githubusercontent.com/Leonxlnx/taste-skill/b17742737e796305d829b3ad39eda3add0d79060/skills/taste-skill/SKILL.md' -o design/SKILL.md
          test "$(git hash-object ponytail/SKILL.md)" = '02c0712c86277d49d18a77da3a2b825657bf02d1'
          test "$(git hash-object design/SKILL.md)" = 'b72132fcd466da605623ffe96e370b3991fc5285'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ponytail/SKILL.md design/SKILL.md
          git commit -m 'Add Ponytail and Design skills from upstream'
          git push origin master